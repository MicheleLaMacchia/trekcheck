name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, coverage, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install packages
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["sdkmanager", "--licenses"],
              input=("y\n" * 100).encode(),
              check=False,
          )
          sys.exit(result.returncode)
          PY
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run tests, lint, coverage gate, and debug build
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          jacocoTestDebugUnitTestReport
          jacocoTestDebugUnitTestCoverageVerification
          assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trekcheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ vars.DEBUG_APK_RETENTION_DAYS || 7 }}
